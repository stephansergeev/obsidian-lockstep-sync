name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum
      - name: gofmt
        working-directory: server
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        working-directory: server
        run: go vet ./...
      # Харнесс из spec §9: каждый сценарий проверяет, что ни одна версия
      # текста не исчезла молча. Красный тест здесь = ошибка потери данных.
      - name: test
        working-directory: server
        run: go test -race ./...
      - name: build
        working-directory: server
        run: CGO_ENABLED=0 go build ./...

  plugin:
    name: plugin (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - working-directory: plugin
        run: npm ci
      - working-directory: plugin
        run: npm run build
