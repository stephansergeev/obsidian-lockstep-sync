name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum
      - name: gofmt
        working-directory: server
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        working-directory: server
        run: go vet ./...
      # The harness from spec §9: every scenario checks that no version of the
      # text disappeared quietly. A red test here means a data loss bug.
      - name: test
        working-directory: server
        run: go test -race ./...
      - name: build
        working-directory: server
        run: CGO_ENABLED=0 go build ./...

  plugin:
    name: plugin (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - working-directory: plugin
        run: npm ci
      - name: types
        working-directory: plugin
        run: npm run check
      # The integration tests drive the real engine against a real server, so the
      # binary has to exist first. Everything that has gone wrong so far went wrong
      # between the pieces rather than inside one of them.
      - name: build server for integration tests
        run: make server
      - name: tests
        working-directory: plugin
        run: npm test
      - working-directory: plugin
        run: npm run build

  image:
    name: container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built but not pushed, so a broken Dockerfile is caught on the commit that
      # breaks it rather than on the release that needed it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
