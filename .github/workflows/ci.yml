name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum
      - name: gofmt
        working-directory: server
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        working-directory: server
        run: go vet ./...
      # The harness from spec §9: every scenario checks that no version of the
      # text disappeared quietly. A red test here means a data loss bug.
      - name: test
        working-directory: server
        run: go test -race ./...
      - name: build
        working-directory: server
        run: CGO_ENABLED=0 go build ./...

  plugin:
    name: plugin (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - working-directory: plugin
        run: npm ci
      - name: types
        working-directory: plugin
        run: npm run check
      # The three-way merge is the one place in the plugin where text can be
      # destroyed, so it is tested on its own before anything is bundled.
      - name: merge tests
        working-directory: plugin
        run: npm test
      - working-directory: plugin
        run: npm run build
