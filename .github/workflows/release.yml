name: Release

# Builds every release artefact on a clean machine from a tagged commit, so what
# people download is traceable to source rather than to somebody's laptop.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the provenance attestation below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # Nothing ships that has not passed the same checks as an ordinary commit.
      - name: server tests
        working-directory: server
        run: go test -race ./...

      # The integration tests drive the real engine against a real server, so the
      # native binary has to exist before they run.
      - name: build server
        run: make server

      - name: plugin
        run: |
          npm ci
          npm test
          npm run build

      - name: build server for release
        run: make cross

      - name: collect artefacts
        run: |
          mkdir -p dist
          mv bin/sync-server-linux-amd64 bin/sync-server-linux-arm64 dist/
          cp main.js manifest.json styles.css versions.json ops/install.sh dist/

      # A checksum file is the difference between "download and hope" and "verify".
      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      # GitHub signs a statement that these exact bytes came out of this workflow
      # on this commit. Anyone can check it: gh attestation verify main.js --owner stephansergeev
      - name: attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/styles.css
            dist/manifest.json
            dist/sync-server-linux-amd64
            dist/sync-server-linux-arm64

      - name: verify the manifest matches the tag
        run: |
          MANIFEST=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          if [ "$MANIFEST" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json says $MANIFEST but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  # The container is the second route, for machines that only run containers.
  # Publishing it on every release is the price of offering it at all: an image
  # that lags behind the binaries is worse than no image.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
